---
- name: Inspect PX-Backup Cluster Discovery Configurations
  hosts: localhost
  gather_facts: true

  vars_files:
    - "{{ inventory_dir }}/group_vars/common/all.yaml"
    - "{{ inventory_dir }}/group_vars/cluster_discovery_config/inspect.yaml"

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - px_backup_api_url is defined
          - cluster_discovery_configs_inspect is defined
        fail_msg: "Required variables must be defined"

  tasks:
    - name: Login and fetch Px-Backup token
      include_tasks: "{{ playbook_dir | dirname }}/auth/auth.yaml"
    - name: Inspect cluster discovery configs
      block:
        - name: Get cluster discovery config details
          cluster_discovery_config:
            operation: INSPECT_ONE
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            name: "{{ item.name }}"
            org_id: "{{ org_id | default('default') }}"
            uid: "{{ item.uid | default(omit) }}"
            include_secrets: "{{ item.include_secrets | default(default_include_secrets) }}"
            ssl_config: "{{ ssl_config.px_backup | default({}) }}"
          register: inspect_result
          loop: "{{ cluster_discovery_configs_inspect }}"
          loop_control:
            label: "{{ item.name }}"

      rescue:
        - name: Display error details
          debug:
            msg: "Failed to inspect cluster discovery configs: {{ inspect_result.results | selectattr('failed', 'true') | map(attribute='msg') | list }}"
          when: inspect_result is defined and inspect_result.results is defined

        - name: Fail with error message
          fail:
            msg: "Failed to inspect cluster discovery configs. See above for details."

    # Output configuration
    - name: Handle output
      include_tasks: "{{ playbook_dir | dirname }}/output_handler/main.yaml"
      vars:
        output_data: "{{ inspect_result }}"
        output_filename_prefix: "cluster_discovery_config_inspect"
      when: output_config.enabled | default(false)
