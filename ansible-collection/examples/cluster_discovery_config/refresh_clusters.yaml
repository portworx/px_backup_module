---
- name: Trigger Credential Refresh for PX-Backup Discovery Configurations
  hosts: localhost
  gather_facts: true

  vars_files:
    - "{{ inventory_dir }}/group_vars/common/all.yaml"
    - "{{ inventory_dir }}/group_vars/cluster_discovery_config/refresh.yaml"

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - px_backup_api_url is defined
          - cluster_discovery_configs_refresh is defined
        fail_msg: "Required variables must be defined"

  tasks:
    - name: Login and fetch Px-Backup token
      include_tasks: "{{ playbook_dir | dirname }}/auth/auth.yaml"
    # Note: REFRESH_CLUSTERS is an async operation.
    # A successful response means the refresh was triggered, not that it completed.
    # Use INSPECT_ONE to poll the config's refresh_status field for completion.
    - name: Trigger credential refresh
      block:
        - name: Refresh clusters
          cluster_discovery_config:
            operation: REFRESH_CLUSTERS
            api_url: "{{ px_backup_api_url }}"
            token: "{{ px_backup_token }}"
            name: "{{ item.name }}"
            org_id: "{{ org_id | default('default') }}"
            uid: "{{ item.uid | default(omit) }}"
            ssl_config: "{{ ssl_config.px_backup | default({}) }}"
          register: refresh_result
          loop: "{{ cluster_discovery_configs_refresh }}"
          loop_control:
            label: "{{ item.name }}"

      rescue:
        - name: Display error details
          debug:
            msg: "Failed to trigger credential refresh: {{ refresh_result.results | selectattr('failed', 'true') | map(attribute='msg') | list }}"
          when: refresh_result is defined and refresh_result.results is defined

        - name: Fail with error message
          fail:
            msg: "Failed to trigger credential refresh. See above for details."

    # Output configuration
    - name: Handle output
      include_tasks: "{{ playbook_dir | dirname }}/output_handler/main.yaml"
      vars:
        output_data: "{{ refresh_result }}"
        output_filename_prefix: "cluster_discovery_config_refresh"
      when: output_config.enabled | default(false)
