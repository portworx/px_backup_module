---
- name: Configure PX-Backup Schedules
  hosts: localhost
  gather_facts: true

  vars_files:
    - "{{ inventory_dir }}/group_vars/common/all.yaml"
    - "{{ inventory_dir }}/group_vars/backup_schedule/enumerate_vars.yaml"

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - px_backup_api_url is defined
          - org_id is defined
        fail_msg: "Required variables must be defined"
  
  tasks:
    - name: Login and fetch Px-Backup token
      include_tasks: "{{ playbook_dir | dirname }}/auth/auth.yaml"
      
    - name: List All Backup Schedule
      backup_schedule:
        operation: INSPECT_ALL
        api_url: "{{ px_backup_api_url }}"
        token: "{{ px_backup_token }}"
        org_id: "{{ org_id }}"
        max_objects: "{{ max_objects | default(omit) }}"
        object_index: "{{ object_index | default(omit) }}"
        name_filter: "{{ name_filter | default(omit) }}"
        labels: "{{ labels | default(omit) }}"
        cluster_name_filter: "{{ cluster_name_filter | default(omit) }}"
        cluster_uid_filter: "{{ cluster_uid_filter | default(omit) }}"
        include_detailed_resources: "{{ include_detailed_resources | default(omit) }}"
        backup_object_type: "{{ backup_object_type | default(omit) }}"
        owners: "{{ owners | default(omit) }}"
        status: "{{ status | default(omit) }}"
        time_range: "{{ time_range | default(omit) }}"
        sort_option: "{{ sort_option | default(omit) }}"
        # SSL Certificate Parameters
        ssl_config: "{{ ssl_config.px_backup | default({}) }}"
      register: backup_schedule_result


    # Output configuration: Display the output or save to file
    - name: Handle output
      include_tasks: "{{ playbook_dir | dirname }}/output_handler/main.yaml"
      vars:
        output_data: "{{ backup_schedule_result }}"
        output_filename_prefix: "backup_schedule_enumerate"
      when: output_config.enabled | default(false)
