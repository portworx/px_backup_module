---
backup_deletes:
  # Single delete by name (and optional uid / cluster_ref)
  # NOTE: 'name' selects a single delete and cannot be combined with bulk selectors.
  - name: "prod-backup"
    # Optional: cluster_ref if deleting through specific cluster
    cluster_ref:
      name: "prod-cluster"

  - name: "test-backup"

  # Bulk delete: match backups by name regex, exclude others by regex.
  # include_filter / exclude_filter are case-insensitive regex; use ".*" to match all.
  # NOTE: bulk delete requires acknowledge: true to confirm the operation.
  - acknowledge: true
    include_filter: ".*test.*"
    exclude_filter: "^keep-"
    cluster_scope:
      all_clusters: true

  # Bulk delete: explicit list of backups (each entry needs at least name or uid).
  # include_objects is mutually exclusive with include_filter and exclude_objects.
  - acknowledge: true
    include_objects:
      - name: "backup-1"
        uid: "backup-uid-1"
      - uid: "backup-uid-2"

  # Bulk delete: match all, filter by backup location and cluster scope
  - acknowledge: true
    include_filter: ".*"
    backup_location_ref_filter:
      - name: "s3-location"
        uid: "location-uid"
    cluster_scope:
      cluster_refs:
        - name: "prod-cluster"
          uid: "cluster-uid"

  # Bulk delete: advanced filters via backup_delete_enumerate_options.
  # These filters select the backups on their own, so no include_filter is
  # needed - the entry below deletes every failed backup.
  # - acknowledge: true
  #   backup_delete_enumerate_options:
  #     status:
  #       - "Failed"

  # Bulk delete: every advanced filter, combined with a name regex.
  # All filters are optional; omit the ones you do not need.
  # - acknowledge: true
  #   include_filter: ".*test.*"
  #   backup_delete_enumerate_options:
  #     # Restrict to backups created in this window (RFC3339 timestamps)
  #     time_range:
  #       start_time: "2026-01-01T00:00:00Z"
  #       end_time: "2026-03-31T23:59:59Z"
  #     # Only backups carrying these labels
  #     labels:
  #       environment: "staging"
  #     # Only backups owned by these user UIDs
  #     owners:
  #       - "owner-uid-1"
  #     # One of 'Invalid', 'All', 'VirtualMachine'
  #     backup_object_type:
  #       type: "VirtualMachine"
  #     # String status values, e.g. "Success", "Failed", "PartialSuccess"
  #     status:
  #       - "Failed"
  #       - "PartialSuccess"
  #     # Only backups produced by these schedule policies
  #     schedule_policy_ref:
  #       - name: "daily-policy"
  #         uid: "policy-uid"
  #     # Only backups produced by these backup schedules
  #     backup_schedule_ref:
  #       - name: "nightly-schedule"
  #         uid: "schedule-uid"
