---
# Define backup locations list
backup_locations:
  # S3 Configuration
  - name: "s3-backup"
    location_type: "S3"
    path: "my-backup-bucket"
    cloud_credential_ref:
      cloud_credential_name: "s3-credentials"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"
    s3_config:
      region: "us-east-1"
      endpoint: "s3.amazonaws.com"
      disable_ssl: false
      disable_path_style: false
      storage_class: "STANDARD"
      sse_type: "SSE_S3"

  # GCP Configuration
  - name: "gcp-backup"
    location_type: "Google"
    path: "my-gcp-backup-bucket"
    cloud_credential_ref:
      cloud_credential_name: "gcp-credentials"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"

  # Azure Configuration
  - name: "azure-backup"
    location_type: "Azure"
    path: "my-azure-container"
    cloud_credential_ref:
      cloud_credential_name: "azure-credentials"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"
    azure_config:
      azure_environment: "AZURE_GLOBAL"

  # NFS Configuration
  - name: "nfs-backup"
    location_type: "NFS"
    path: "/backups"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"
    nfs_config:
      server_addr: "nfs.example.com"
      sub_path: "/data"
      mount_option: "rw,sync"

  # Federated (Workload Identity) Azure backup location.
  # No cloud_credential_ref; cluster identities authenticate against Azure.
  # Validation is asynchronous — the API triggers it on each cluster and returns
  # immediately. Use INSPECT_ONE to check cluster_status after creation.
  # Replace azure_resource_group_name, azure_account_name, azure_subscription_id,
  # and cluster_refs below with your actual Azure and cluster values before running.
  - name: "prod-azure-federated"
    location_type: "Azure"
    path: "my-azure-container"
    encryption_key: "{{ encryption_key }}"
    object_lock_enabled: false
    federated: true
    s3_config:
      azure_environment:
        type: "AZURE_GLOBAL"
      azure_resource_group_name: "my-rg"
      azure_account_name: "mystorageaccount"
      azure_subscription_id: "00000000-0000-0000-0000-000000000000"
    cluster_refs:
      - name: "cluster-1"
        uid: "cluster-1-uid"
      - name: "cluster-2"
        uid: "cluster-2-uid"

  # Federated (Workload Identity) AWS S3 backup location.
  # Uses AWS IRSA / EKS Pod Identity — no cloud_credential_ref.
  # endpoint and disable_ssl are ignored in federated mode (TLS always enforced);
  # region is optional and falls back to AWS_REGION on the Stork pod if omitted.
  # Replace region and cluster_refs below with your actual values before running.
  - name: "prod-aws-federated"
    location_type: "S3"
    path: "my-bucket/backups"
    encryption_key: "{{ encryption_key }}"
    object_lock_enabled: false
    federated: true
    s3_config:
      region: "us-west-2"
    cluster_refs:
      - name: "cluster-1"
        uid: "cluster-1-uid"

  # Federated (Workload Identity) Google backup location.
  # No cloud_credential_ref; cluster identities authenticate against Google Cloud.
  # google_project_id is required in federated mode since no cloud credential is
  # referenced. Replace google_project_id and cluster_refs with your actual values.
  - name: "prod-gcs-federated"
    location_type: "Google"
    path: "my-bucket/backups"
    encryption_key: "{{ encryption_key }}"
    object_lock_enabled: false
    federated: true
    s3_config:
      google_project_id: "my-gcp-project"
    cluster_refs:
      - name: "cluster-1"
        uid: "cluster-1-uid"
