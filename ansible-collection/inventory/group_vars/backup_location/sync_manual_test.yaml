# PB-18144: parameterised sync_manual acceptance matrix.
# Each entry has an `expect` of "accept" or "reject"; sync_manual_test.yaml
# runs CREATE for every entry and asserts the server returned the expected
# outcome.
#
# Edit the knobs below for your environment:
#   non-fed cases -> s3_endpoint, s3_bucket, s3_cred_name/uid
#   fed cases     -> fed_bucket, fed_region, fed_cluster_name/uid

# --- non-fed knobs (edit for your environment) ---
s3_endpoint: "s3.example.com"
s3_bucket: "my-backup-bucket"
s3_region: "us-east-1"
s3_cred_name: "my-s3-cred"
s3_cred_uid: "<cloud-credential-uid>"

# --- fed knobs (edit for your environment) ---
fed_bucket: "my-bucket/backups"
fed_region: "us-west-2"
fed_cluster_name: "cluster-1"
fed_cluster_uid: "<cluster-uid>"


sync_manual_test_locations:

  # non-fed + sync_manual omitted -> server rejects (field required in non-fed CREATE)
  - name: "sm-nonfed-omitted"
    expect: "reject"
    location_type: "S3"
    path: "{{ s3_bucket }}"
    cloud_credential_ref:
      cloud_credential_name: "{{ s3_cred_name }}"
      cloud_credential_uid: "{{ s3_cred_uid }}"
    validate_cloud_credential: false
    s3_config:
      region: "{{ s3_region }}"
      endpoint: "{{ s3_endpoint }}"
      disable_ssl: true

  # non-fed + sync_manual: false -> accepted (automatic sync)
  - name: "sm-nonfed-false"
    expect: "accept"
    location_type: "S3"
    path: "{{ s3_bucket }}"
    cloud_credential_ref:
      cloud_credential_name: "{{ s3_cred_name }}"
      cloud_credential_uid: "{{ s3_cred_uid }}"
    validate_cloud_credential: false
    sync_manual: false
    s3_config:
      region: "{{ s3_region }}"
      endpoint: "{{ s3_endpoint }}"
      disable_ssl: true

  # fed + sync_manual: false -> server rejects (only true is valid in federated mode)
  - name: "sm-fed-false"
    expect: "reject"
    location_type: "S3"
    path: "{{ fed_bucket }}"
    federated: true
    sync_manual: false
    s3_config:
      region: "{{ fed_region }}"
    cluster_refs:
      - name: "{{ fed_cluster_name }}"
        uid: "{{ fed_cluster_uid }}"

  # fed + sync_manual: true -> accepted
  - name: "sm-fed-true"
    expect: "accept"
    location_type: "S3"
    path: "{{ fed_bucket }}"
    federated: true
    sync_manual: true
    s3_config:
      region: "{{ fed_region }}"
    cluster_refs:
      - name: "{{ fed_cluster_name }}"
        uid: "{{ fed_cluster_uid }}"

  # fed + sync_manual omitted -> accepted (server defaults to true in federated mode)
  - name: "sm-fed-omitted"
    expect: "accept"
    location_type: "S3"
    path: "{{ fed_bucket }}"
    federated: true
    s3_config:
      region: "{{ fed_region }}"
    cluster_refs:
      - name: "{{ fed_cluster_name }}"
        uid: "{{ fed_cluster_uid }}"
