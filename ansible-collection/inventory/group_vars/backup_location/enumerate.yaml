---
# Variables specific to enumeration operations
include_secrets: false
labels: {}  # Optional labels for filtering

# Optional filters
cloud_credential_filter: "{{ cloud_cred_name | default(omit) }}"
max_results: 100
cloud_credential_ref:
  name: "{{ cloud_cred_name | default(omit) }}"
  uid: "{{ cloud_cred_uid | default(omit) }}"

# Pagination options
# max_objects: 10                    # Maximum number of backup locations to return
# object_index: 0                    # Starting index for pagination

# Name filter - performs substring matching
# name_filter: "s3"                  # Filter backup locations containing "s3" in name

# Sorting options
# sort_option:
#   sort_by: "Name"                  # Options: 'CreationTimestamp', 'Name'
#   sort_order: "Ascending"          # Options: 'Ascending', 'Descending'

# Time range filter - filter by creation time
# time_range:
#   start_time: "2024-01-01T00:00:00Z"  # ISO 8601 format
#   end_time: "2024-12-31T23:59:59Z"    # ISO 8601 format
