---
# Backup locations to update
backup_locations_update:
  - name: "s3-bl"
    location_type: "S3"
    path: "s3-bl-path/bucket"
    cloud_credential_ref:
      cloud_credential_name: "s3-cloud-cred-name"
    validate_cloud_credential: true
    object_lock_enabled: false
    s3_config:
      region: "us-east-1"
      endpoint: "s3.amazonaws.com"
      disable_ssl: false
      disable_path_style: false
      storage_class: "STANDARD"
      sse_type: "SSE_S3"
    labels:
      environment: "production"
      team: "devops"
    ownership:
      owner: "admin"
      groups:
        - id: "devops-team"
          access: "Write"
        - id: "monitoring-team"
          access: "Read"
      collaborators:
        - id: "external-auditor"
          access: "Read"


  # NFS Configuration
  - name: "nfs-bl"
    location_type: "NFS"
    path: "/mnt/nfs-share"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"
    nfs_config:
      server_addr: "nfs-pxbkp.pwx.dev.purestorage.com"
      sub_path: "/tests-ansible"
      mount_option: "rw,sync"


  # GCP Configuration
  - name: "gcp-bl"
    location_type: "Google"
    path: "my-gcp-backup-bucket"
    cloud_credential_ref:
      cloud_credential_name: "gcp-cred-name"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"
    google_config:
      project_id: "portworx-eng"
      json_key: |
        {
          "type": "service_account",
          "project_id": "my-project-id",
          "private_key_id": "abcd1234...",
          "private_key": "-----BEGIN PRIVATE KEY-----\nYourPrivateKey\n-----END PRIVATE KEY-----\n",
          "client_email": "service-account@project.iam.gserviceaccount.com",
          "client_id": "123456789",
          "auth_uri": "https://accounts.google.com/o/oauth2/auth",
          "token_uri": "https://oauth2.googleapis.com/token",
          "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
          "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/service-account%40project.iam.gserviceaccount.com"
        }


  # Azure Configuration
  - name: "azure-bl"
    location_type: "Azure"
    path: "my-azure-container"
    cloud_credential_ref:
      cloud_credential_name: "azure"
    encryption_key: "{{ encryption_key }}"
    validate_cloud_credential: true
    object_lock_enabled: "{{ object_lock }}"
    azure_config:
      account_name: "mystorageaccount"
      account_key: "your-azure-storage-account-key"
      client_secret: "your-azure-client-secret"
      client_id: "your-azure-client-id"
      tenant_id: "your-azure-tenant-id"
      subscription_id: "your-azure-subscription-id"
      azure_environment: "AZURE_GLOBAL"


  # Federated (Workload Identity) Azure backup location.
  # UPDATE replaces the entire cluster_refs set and re-validates ALL associated clusters,
  # not just newly added ones. Use INSPECT_ONE to check cluster_status after the update.
  # Replace azure_resource_group_name, azure_account_name, azure_subscription_id,
  # and cluster_refs below with your actual Azure and cluster values before running.
  - name: "prod-azure-federated"
    location_type: "Azure"
    path: "my-azure-container"
    encryption_key: "{{ encryption_key }}"
    object_lock_enabled: false
    federated: true
    s3_config:
      azure_environment:
        type: "AZURE_GLOBAL"
      azure_resource_group_name: "my-rg"
      azure_account_name: "mystorageaccount"
      azure_subscription_id: "00000000-0000-0000-0000-000000000000"
    cluster_refs:
      - name: "cluster-1"
        uid: "cluster-1-uid"
      - name: "cluster-3"
        uid: "cluster-3-uid"


# Global update configuration
backup_configs: true
