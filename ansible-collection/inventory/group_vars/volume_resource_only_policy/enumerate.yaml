---
# Unified enumerate_options for pagination and filtering
# VRO uses a nested structure with generic_enumerate_options
enumerate_options:
  generic_enumerate_options:
    max_objects: 50
    object_index: 0
    name_filter: ""
    labels: {}
    time_range:
      start_time: ""
      end_time: ""
    sort_option:
      sortBy: "CreationTimestamp"
      sortOrder: "Descending"
  volume_types: []
